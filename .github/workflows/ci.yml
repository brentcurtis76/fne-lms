# GENERA — CI: quality gates on every PR (Fase 0)
# Gates: (1) typecheck  (1b) lint (zero warnings)  (2) unit/Vitest  (3) supabase test db (pgTAP/RLS)
#        (4) Playwright e2e on a seeded, ephemeral local Supabase stack (T2)
# Plus: RLS migration guard (blocks any migration that disables ROW LEVEL SECURITY).
# Branch protection on `main` must require these six checks — see docs/ci-setup.md.
# All jobs: timeout-minutes 20 (GitHub default is 360 — a hung job would burn 6h of Actions).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls-migration-guard:
    name: RLS migration guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Block migrations that disable RLS
        run: bash scripts/ci/check-rls-migrations.sh

  typecheck:
    name: Gate 1 — Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check

  lint:
    name: Gate 1b — Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Gate 2 — Unit (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  pgtap:
    name: Gate 3 — RLS pgTAP (supabase test db)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # NOTE: `supabase db start` builds a shadow DB from supabase/migrations.
      # Repo migrations start at 2026-02 (schema predates them). If they fail to
      # apply from scratch, add a baseline schema snapshot as the first migration
      # (supabase db dump from a trusted source) — see docs/ci-setup.md.
      - name: Start local Supabase stack (applies migrations)
        run: supabase db start
      - name: Run pgTAP suite (supabase/tests/)
        run: supabase test db
      # §17 overlapping-ticker proof. Reuses the stack the pgTAP steps already
      # started: two concurrent runZoomTick loops against the REAL
      # claim_zoom_jobs, asserting every job runs exactly once. This is the
      # FOR UPDATE SKIP LOCKED proof the vitest queue suite explicitly disclaims
      # — no in-process double can produce a second transaction to skip a lock
      # on. `supabase db start` brings up Postgres only (no PostgREST), so the
      # proof speaks SQL and needs the Node toolchain the other gates set up.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Queue concurrency proof (§17 overlapping ticker)
        run: |
          # Ask the CLI for the URL rather than hardcoding the default port, so a
          # future [db] section in supabase/config.toml cannot silently break this.
          eval "$(supabase status -o env | grep '^DB_URL=')"
          SUPABASE_DB_URL="${DB_URL}" npm run test:queue

  # T2: the e2e gate runs against an ISOLATED, EPHEMERAL Supabase stack started on
  # the runner — no remote QA project, no production credentials, no shared state.
  # `supabase db reset` re-applies every migration from scratch, so the schema the
  # specs exercise is exactly what supabase/migrations declares, and the fixtures
  # are seeded fresh (scripts/ci/seed-e2e.mjs) for each run. Everything dies with
  # the runner.
  e2e:
    name: Gate 4 — E2E (Playwright on seeded local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, unlike gate 3: this job passes service names to `supabase start -x`,
          # and a rename in a future CLI release would break the gate on an unrelated PR.
          version: 2.110.0
      - run: npm ci

      # Excluded services are the ones no e2e path touches; skipping them saves
      # several GB of image pulls per run. db, auth, rest, storage and kong stay.
      - name: Start ephemeral local Supabase stack
        run: supabase start -x studio,logflare,vector,edge-runtime,imgproxy,mailpit,realtime,supavisor,pooler
      - name: Apply all migrations from scratch
        run: supabase db reset

      - name: Point the app at the local stack
        run: |
          set -euo pipefail
          STATUS="$(supabase status -o json)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -er '.API_URL' <<<"$STATUS")"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -er '.ANON_KEY' <<<"$STATUS")"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -er '.SERVICE_ROLE_KEY' <<<"$STATUS")"
            # A floor, not a feature: `resolveZoomMode` (lib/zoom/api.ts:431-436) treats an
            # UNSET ZOOM_MODE as `live`, which is right for production and wrong for a test
            # environment. Reachable only through the job registry behind
            # pages/api/cron/zoom-{ticker,reconcile}.ts.
            # No longer unexercised (Z1c-4): tests/e2e/zoom-mock-mode.spec.ts drives a
            # registered `host_sync` job through this server and asserts it completes on
            # the fake, with negative controls proving the job REFUSES to run — without
            # emitting a Zoom request — when this value is invalid or absent.
            # Runtime-only (not NEXT_PUBLIC_*), so build ordering is irrelevant.
            echo "ZOOM_MODE=mock"
            # Synthetic, and never a real credential: this stack is ephemeral and dies with
            # the runner. `authorizeCronRequest` (lib/zoom/cron-auth.ts:51) compares the whole
            # `Authorization` header constant-time, so the cron routes fail closed without it
            # and zoom-mock-mode.spec.ts could not reach the queue at all.
            echo "CRON_SECRET=e2e-synthetic-cron-secret-not-a-real-credential"
            # Required, not cosmetic. `getAppBaseUrl` (lib/utils/app-url.ts:91-102) THROWS
            # in production rather than trusting the client-controlled Host header, and the
            # e2e gate serves a production build — so every surface that emits an absolute
            # platform URL (the .ics `join_url`, reminder notifications) returns HTTP 500
            # here without it. Z1c-1 never hit this because its only session had a NULL
            # meeting_link and the join_url branch was therefore never taken.
            # Unlike ZOOM_MODE this is NEXT_PUBLIC_*, so it is inlined at build time and
            # must precede the build step — as it does.
            echo "NEXT_PUBLIC_BASE_URL=http://localhost:3000"
            # Z2-S8: §14's master kill switch, ON for the e2e tenant. It defaults OFF
            # (lib/featureFlags.ts — "all flags default to false for production safety"),
            # and with it off `resolveMeetSessionAccess` answers `disabled` for every
            # managed session, so tests/e2e/zoom-managed-join.spec.ts would have no join
            # affordance to assert the existence of. That spec asserts `meet-join-disabled`
            # is ABSENT, so this line going missing fails the gate loudly rather than
            # quietly turning the managed coverage into "no button, no problem".
            #
            # Both names, because they are one switch with two readers: the server reads
            # FEATURE_ZOOM_MEETINGS (the join route, /meet SSR, the provisioning gate) and
            # the browser reads NEXT_PUBLIC_FEATURE_ZOOM_MEETINGS (lib/featureFlags.ts:18,
            # the create-session toggle). Setting only the first makes those two disagree
            # inside a single page render. NEXT_PUBLIC_* is inlined at build time and this
            # step precedes the build, as it must.
            #
            # WHAT THIS CANNOT COVER: the flag is process env, and a Playwright run has one
            # server, so the OFF branch (503 on the join route, `meet-join-disabled` on the
            # page) is unreachable end to end. It is unit-tested only — see the spec header.
            echo "FEATURE_ZOOM_MEETINGS=true"
            echo "NEXT_PUBLIC_FEATURE_ZOOM_MEETINGS=true"
          } > .env.local

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # NEXT_PUBLIC_* is inlined at build time, so the build must come after .env.local.
      - name: Build (production)
        run: npm run build

      # D-01: the Pasantías price/payment data lives in a server-only module.
      # This scans what the build actually ships to browsers, so a bad import
      # fails the PR instead of publishing a price list.
      - name: Guard — no commercial cohort data in the client bundle
        run: node scripts/check-price-leak.mjs

      - name: Seed synthetic e2e fixtures
        run: |
          set -euo pipefail
          set -a && . ./.env.local && set +a
          node scripts/ci/seed-e2e.mjs

      - name: Run mandatory e2e specs
        run: npx playwright test $(node scripts/ci/e2e-mandatory.mjs --list) --project=chromium

      # A skipped test reports as a success — this is what makes "green" mean "ran".
      - name: Guard — no mandatory spec may be skipped
        if: always()
        run: node scripts/ci/e2e-mandatory.mjs --check test-results/e2e-results.json

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Tear down local Supabase stack
        if: always()
        run: supabase stop --no-backup
